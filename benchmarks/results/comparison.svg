<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390" role="img" aria-labelledby="title desc"><title id="title">StreamMD versus Streamdown</title><desc id="desc">Median total seconds, lower is better. 10 KiB: StreamMD 0.68, Streamdown 0.89 seconds. 100 KiB: StreamMD 6.18, Streamdown 15.27 seconds. 500 KiB: StreamMD 38.03, Streamdown 274.86 seconds. 500 KiB includes a 100 ms delay per update for both libraries.</desc><rect width="800" height="390" fill="white"/><g font-family="system-ui, sans-serif" font-size="13" fill="#24292f"><text x="24" y="28" font-size="18" font-weight="600">StreamMD vs Streamdown</text><text x="24" y="50">Median total seconds · lower is better · mixed content</text><line x1="100" x2="100" y1="70" y2="320" stroke="#e2e5e9"/><text x="100" y="340" text-anchor="middle">0.0 s</text><line x1="210" x2="210" y1="70" y2="320" stroke="#e2e5e9"/><text x="210" y="340" text-anchor="middle">63.2 s</text><line x1="320" x2="320" y1="70" y2="320" stroke="#e2e5e9"/><text x="320" y="340" text-anchor="middle">126.4 s</text><line x1="430" x2="430" y1="70" y2="320" stroke="#e2e5e9"/><text x="430" y="340" text-anchor="middle">189.7 s</text><line x1="540" x2="540" y1="70" y2="320" stroke="#e2e5e9"/><text x="540" y="340" text-anchor="middle">252.9 s</text><line x1="650" x2="650" y1="70" y2="320" stroke="#e2e5e9"/><text x="650" y="340" text-anchor="middle">316.1 s</text><text x="24" y="109">10 KiB</text><rect x="100" y="86" width="1.180598885616522" height="21" fill="#2563eb"/><text x="108.18059888561652" y="101">0.68 s</text><rect x="100" y="114" width="1.544783626624056" height="21" fill="#64748b"/><text x="108.54478362662405" y="129">0.89 s</text><text x="24" y="189">100 KiB</text><rect x="100" y="166" width="10.760936990735233" height="21" fill="#2563eb"/><text x="117.76093699073523" y="181">6.18 s</text><rect x="100" y="194" width="26.56808596108644" height="21" fill="#64748b"/><text x="133.56808596108644" y="209">15.27 s</text><text x="24" y="269">500 KiB</text><rect x="100" y="246" width="66.17826608170054" height="21" fill="#2563eb"/><text x="173.17826608170054" y="261">38.03 s</text><rect x="100" y="274" width="478.26086956521743" height="21" fill="#64748b"/><text x="585.2608695652175" y="289">274.86 s</text><rect x="450" y="18" width="12" height="12" fill="#2563eb"/><text x="468" y="29">StreamMD</text><rect x="575" y="18" width="12" height="12" fill="#64748b"/><text x="593" y="29">Streamdown</text><text x="24" y="377">500 KiB: 100 ms delay per update for both. 10/100 KiB: no inserted delay.</text></g></svg>
